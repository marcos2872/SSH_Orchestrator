[package]
name = "rdp-poc"
version = "0.1.0"
edition = "2021"

[dependencies]
ironrdp = { version = "0.15", features = ["session", "connector", "graphics", "input"] }
ironrdp-blocking = "0.9"
ironrdp-pdu = "0.8"
ironrdp-graphics = "0.8"
anyhow = "1"
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
sspi = { version = "0.21", features = ["network_client"] }
tokio-rustls = "0.26"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
minifb = "0.28"
